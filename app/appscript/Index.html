<title>Just Follow</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- fonts load without holding up the first paint (system fonts until they arrive) -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Noto+Sans+JP:wght@400;600&display=swap" media="print" onload="this.media='all'">
<style>
/* Layout: one phone column; sticky header + day strip, timeline cards, bottom tab bar.
   Just Follow brand (15 Nov 2026): night ink on warm off-white, duckling yellow for "now", coral dotted trail for drives and walks,
   deep coral for anything still to book, pond teal for good. Bricolage Grotesque headings, Inter text. */
:root {
  --bg: #FCFAF6;
  --surface: #FFFFFF;
  --surface-2: #F3EEE6;
  --chip: #F3EEE6;
  --on-chip: #4A3D33;
  --on-chip-2: #6E5D4F;
  --line: #E6DFD4;
  --ink: #1B2340;
  --ink-2: #4A3D33;
  --ink-3: #6E5D4F;
  --accent: #1B2340;
  --accent-soft: #FDE9B8;
  --on-accent: #FFFFFF;
  --duck: #F6B92B;
  --on-duck: #1B2340;
  --trail: #F2643D;
  --persimmon: #B23E1C;
  --persimmon-soft: #FDE1D6;
  --good: #0E6B70;
  --good-soft: #D5ECEA;
  --amber: #8A5A00;
  --amber-soft: #FBEBC4;
  --neg: #B23E1C;
  --pos: #0E6B70;
  --bar: #F6B92B;
  --on-bar: #1B2340;
  --shadow: 0 4px 14px rgba(27,35,64,.06);
  --font-display: 'Bricolage Grotesque', 'Inter', system-ui, sans-serif;
  --font-body: 'Inter', 'Noto Sans JP', system-ui, -apple-system, 'Hiragino Sans', sans-serif;
  --r: 20px;
  --r-btn: 14px;
  --tabbar-h: 64px;
  --chat-h: 60px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #3A4470; --surface: #46517F; --surface-2: #525E8E; --line: #5F6B9B; --chip: #5F6BA0; --on-chip: #FFFFFF; --on-chip-2: #E4E8F5;
    --ink: #F3ECE2; --ink-2: #D3C6B6; --ink-3: #CFC5B8;
    --accent: #F6B92B; --accent-soft: #625C48; --on-accent: #1B2340;
    --duck: #F6B92B; --on-duck: #1B2340; --trail: #F2643D;
    --persimmon: #FF9B7D; --persimmon-soft: #6A3424;
    --good: #6FD0CF; --good-soft: #22575A; --amber: #F2C86B; --amber-soft: #3F3216;
    --neg: #FF9B7D; --pos: #6FD0CF; --bar: #8C7A55; --on-bar: #F3ECE2;
    --shadow: 0 4px 14px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #3A4470; --surface: #46517F; --surface-2: #525E8E; --line: #5F6B9B; --chip: #5F6BA0; --on-chip: #FFFFFF; --on-chip-2: #E4E8F5;
  --ink: #F3ECE2; --ink-2: #D3C6B6; --ink-3: #CFC5B8;
  --accent: #F6B92B; --accent-soft: #625C48; --on-accent: #1B2340;
  --duck: #F6B92B; --on-duck: #1B2340; --trail: #F2643D;
  --persimmon: #FF9B7D; --persimmon-soft: #6A3424;
  --good: #6FD0CF; --good-soft: #22575A; --amber: #F2C86B; --amber-soft: #3F3216;
  --neg: #FF9B7D; --pos: #6FD0CF; --bar: #8C7A55; --on-bar: #F3ECE2;
  --shadow: 0 4px 14px rgba(0,0,0,.25);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 15px; line-height: 1.45;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
a { color: var(--accent); text-underline-offset: 2px; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.wrap {
  max-width: 560px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.num { font-variant-numeric: tabular-nums; }

/* header */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: var(--bg);
  border-bottom: 1px solid var(--line);
}
.top .wrap { padding-block: 12px 10px; display: flex; flex-direction: column; gap: 2px; }
.eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
.top h1 { margin: 0; font-family: var(--font-display); font-size: 22px; line-height: 1.2; font-weight: 800; text-wrap: balance; }
.top .sub { font-size: 13px; color: var(--ink-3); }
.top .sub:empty { display: none; }
.days {
  display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none;
  padding-block: 10px 2px; scroll-snap-type: x proximity;
}
.days::-webkit-scrollbar { display: none; }
.days[hidden] { display: none; }
.daychip {
  flex: 0 0 auto; scroll-snap-align: start;
  min-width: 56px; min-height: 52px; padding: 6px 10px;
  border-radius: var(--r-btn); border: 1px solid var(--line); background: var(--surface);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0;
  cursor: pointer;
}
.daychip .dw { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); }
.daychip .dn { font-family: var(--font-display); font-size: 19px; font-weight: 700; line-height: 1.1; }
.daychip .dot { width: 6px; height: 6px; border-radius: 3px; background: transparent; margin-top: 2px; }
.daychip .dot.todo { background: var(--persimmon); }
.daychip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.daychip[aria-pressed="true"] .dw { color: var(--on-accent); opacity: .85; }
.daychip[aria-pressed="true"] .dot.todo { background: var(--duck); }
.daychip.today:not([aria-pressed="true"]) { border-color: var(--duck); box-shadow: inset 0 0 0 1px var(--duck); }

main { padding-bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom, 0px) + 24px); }
main .wrap { padding-block: 16px 0; display: flex; flex-direction: column; gap: 14px; }

/* day head */
.dayhead { display: flex; flex-direction: column; gap: 6px; }
.dayhead h2 { margin: 0; font-family: var(--font-display); font-size: 24px; line-height: 1.2; font-weight: 800; }
.daymeta { display: flex; flex-wrap: wrap; gap: 6px; }
.meta {
  display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px;
  border-radius: 999px; background: var(--chip); color: var(--on-chip); font-size: 13px; font-weight: 500;
}
.meta.todo { background: var(--persimmon-soft); color: var(--persimmon); }
.meta.today { background: var(--duck); color: var(--on-duck); }
.meta.ducks { background: var(--good-soft); color: var(--good); }
.meta svg { flex: 0 0 auto; }

/* timeline */
.timeline { display: flex; flex-direction: column; gap: 10px; }
.row { display: grid; grid-template-columns: 50px minmax(0, 1fr); gap: 10px; align-items: start; }
.time { padding-top: 14px; font-family: var(--font-display); font-size: 15px; font-weight: 600; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.time.empty::before { content: "·"; color: var(--ink-3); padding-left: 12px; }
.card {
  min-width: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r);
  padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; box-shadow: var(--shadow);
}
.card.now { border-color: var(--duck); box-shadow: 0 0 0 2px var(--duck); }
.cardtop { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.kind { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); }
.pill { display: inline-flex; align-items: center; padding: 3px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.pill.booked { background: var(--good-soft); color: var(--good); }
.pill.to_book { background: var(--persimmon-soft); color: var(--persimmon); }
.pill.bookable { background: var(--surface-2); color: var(--ink-2); }
.pill.walk_in { background: var(--surface-2); color: var(--ink-2); }
.pill.optional { background: transparent; border: 1px dashed var(--ink-3); color: var(--ink-2); }
.pills { display: inline-flex; gap: 6px; flex-wrap: wrap; }
.name { font-size: 17px; font-weight: 600; line-height: 1.3; text-wrap: balance; overflow-wrap: anywhere; }
.facts { display: flex; flex-direction: column; gap: 4px; margin: 0; padding: 0; list-style: none; }
.fact { display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 8px; font-size: 14px; color: var(--ink-2); }
.fact svg { margin-top: 2px; color: var(--ink-3); }
.fact span { min-width: 0; overflow-wrap: anywhere; }
.fact .fl { display: block; }
.fact .fl + .fl { margin-top: 4px; }
.details { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 3px; font-size: 14px; color: var(--ink); }
.details li { overflow-wrap: anywhere; }
.details li.h { list-style: none; margin-left: -18px; font-weight: 600; padding-top: 4px; }
/* nested lines: d1/d2 are sub-bullets, num keeps the doc's own "1." numbering, gap marks a blank line in the doc */
.details li.d1, .notes li.d1 { margin-left: 18px; list-style-type: circle; }
.details li.d2, .notes li.d2 { margin-left: 36px; list-style-type: square; }
.details li.d3, .notes li.d3 { margin-left: 54px; list-style-type: square; }
.details li.num, .notes li.num { list-style: none; }
.details li.gap, .notes li.gap { margin-top: 6px; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.btn {
  display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 14px;
  border-radius: var(--r-btn); border: 1px solid var(--line); background: var(--surface);
  font-size: 14px; font-weight: 600; text-decoration: none; color: var(--accent);
}
.btn.primary { background: var(--accent-soft); border-color: transparent; }
.btn.pbtn { padding: 0 11px; }
.gate { max-width: 360px; margin: 24px auto 0; width: 100%; }
.gate + .gate { margin-top: 0; }
.gate input { font: inherit; font-size: 20px; letter-spacing: .2em; min-height: 48px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); width: 100%; }
.gate .btn { justify-content: center; min-height: 48px; cursor: pointer; border: 0; }
.gate .btn:disabled { opacity: .6; }
.gate[hidden], .splash[hidden] { display: none; }
.splash { text-align: center; padding: 48px 0 0; color: var(--ink-2); }
.splash svg { width: 84px; height: 84px; border-radius: 20px; display: block; margin: 0 auto 14px; }
.splash h3 { font-family: var(--font-display); font-size: 26px; margin: 0 0 4px; color: var(--ink); }
.splash p { margin: 0; }
.pk { display: inline-flex; align-items: center; justify-content: center; width: 18px; height: 18px; border-radius: 4px; background: var(--accent); color: var(--on-accent); font-family: var(--font-display); font-size: 12px; font-weight: 700; line-height: 1; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.drive-chip { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--ink-2); font-weight: 500; }
details.more { border-top: 1px solid var(--line); padding-top: 6px; }
details.more > summary {
  list-style: none; cursor: pointer; min-height: 36px; display: flex; align-items: center; justify-content: space-between;
  font-size: 14px; font-weight: 600; color: var(--ink-2);
}
details.more > summary::-webkit-details-marker { display: none; }
details.more > summary::after { content: ""; width: 8px; height: 8px; border-right: 2px solid currentColor; border-bottom: 2px solid currentColor; transform: rotate(45deg); margin-right: 4px; transition: transform .15s; }
details.more[open] > summary::after { transform: rotate(-135deg); }
.notes { margin: 4px 0 6px; padding-left: 18px; display: flex; flex-direction: column; gap: 4px; font-size: 14px; color: var(--ink-2); }
.notes li { overflow-wrap: anywhere; }
.notes li.strong { font-weight: 600; color: var(--ink); }
.backup { margin: 6px 0; padding: 10px 12px; border-radius: 10px; background: var(--surface-2); display: flex; flex-direction: column; gap: 6px; }
.backup .bname { font-weight: 600; font-size: 15px; overflow-wrap: anywhere; }

/* compact row for drives, flights etc */
.mini {
  min-width: 0; display: flex; align-items: center; gap: 10px; padding: 10px 12px;
  border: 0; border-left: 4px dotted var(--trail); border-radius: 0; margin-left: 6px; padding-left: 14px; color: var(--ink-2);
}
.mini .mt { min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 2px; }
.mini .mn { font-weight: 600; color: var(--ink); font-size: 15px; overflow-wrap: anywhere; }
.mini .ms { font-size: 13px; overflow-wrap: anywhere; }
.mini a.ic { flex: 0 0 auto; width: 40px; height: 40px; border-radius: 20px; display: inline-flex; align-items: center; justify-content: center; background: var(--accent-soft); color: var(--accent); }

/* sections on trip / expenses */
.section { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.section h3 { margin: 0; font-family: var(--font-display); font-size: 18px; font-weight: 700; }
.section .hint { font-size: 13px; color: var(--ink-3); margin: -4px 0 0; }
.list { display: flex; flex-direction: column; }
.li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; padding: 10px 0; border-top: 1px solid var(--line); align-items: baseline; }
.li:first-child { border-top: 0; padding-top: 2px; }
.li .t { font-weight: 600; overflow-wrap: anywhere; }
.li .s { grid-column: 1 / -1; font-size: 13px; color: var(--ink-2); overflow-wrap: anywhere; }
.li .r { font-size: 13px; color: var(--ink-2); font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
.todo-item { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); }
.todo-item:first-child { border-top: 0; padding-top: 2px; }
.todo-item button.when { all: unset; cursor: pointer; font-family: var(--font-display); font-weight: 700; font-size: 14px; color: var(--accent); line-height: 1.2; }
.todo-item button.when small { display: block; font-family: var(--font-body); font-weight: 500; font-size: 12px; color: var(--ink-3); }
.todo-item .t { font-weight: 600; overflow-wrap: anywhere; }
.todo-item ul { margin: 4px 0 0; padding-left: 16px; font-size: 14px; color: var(--ink-2); display: flex; flex-direction: column; gap: 2px; }
.todo-item ul li.tb { color: var(--persimmon); font-weight: 600; }

/* trip overview */
.ov-intro { margin: 0; display: flex; flex-direction: column; gap: 6px; font-size: 14px; color: var(--ink-2); }
.ov-intro p { margin: 0; }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.stat { background: var(--chip); color: var(--on-chip); border-radius: 10px; padding: 8px 10px; display: flex; flex-direction: column; gap: 0; min-width: 0; }
.stat b { font-family: var(--font-display); font-size: 20px; line-height: 1.15; font-variant-numeric: tabular-nums; }
.stat span { font-size: 12px; color: var(--on-chip-2); font-weight: 500; }
.stats.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.stats.two + .list .li:first-child { padding-top: 10px; }
.stat .sm { font-size: 12px; color: var(--on-chip); font-weight: 500; margin-top: 4px; line-height: 1.3; }
.stat .sm + .sm { margin-top: 1px; }
.steps { margin: 0; padding: 0; list-style: none; counter-reset: st; display: flex; flex-direction: column; gap: 10px; }
.steps li { counter-increment: st; display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 10px; align-items: start; font-size: 14px; color: var(--ink-2); }
.steps li::before { content: counter(st); width: 26px; height: 26px; border-radius: 13px; background: var(--accent-soft); color: var(--accent); font-weight: 700; font-size: 13px; display: flex; align-items: center; justify-content: center; }
.steps li b { color: var(--ink); }
.steps .ic { display: inline-block; vertical-align: -3px; color: var(--accent); }
.hs-head { display: flex; align-items: center; gap: 12px; }
.hs-head svg { flex: none; width: 44px; height: 44px; border-radius: 10px; }
.hs-head p { margin: 2px 0 0; font-size: 13px; color: var(--ink-3); }
/* traveller initials: one even row, at most 6 per row, then the next row */
.who-row { display: grid; grid-template-columns: repeat(var(--n, 6), minmax(0, 1fr)); gap: 6px; }
.who-row .meta { font-weight: 600; padding: 4px 2px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: block; text-align: center; }
.leg { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; padding: 12px 0; border-top: 1px solid var(--line); }
.leg:first-child { border-top: 0; padding-top: 2px; }
.leg .lh { display: flex; align-items: center; gap: 8px; font-weight: 600; flex-wrap: wrap; overflow-wrap: anywhere; }
.leg .lh svg { color: var(--ink-3); }
.leg .ld { font-size: 13px; color: var(--ink-2); text-align: right; white-space: nowrap; }
.leg .lt { grid-column: 1 / -1; display: flex; align-items: baseline; gap: 8px; font-family: var(--font-display); font-weight: 700; font-size: 20px; font-variant-numeric: tabular-nums; }
.leg .lt .dur { font-family: var(--font-body); font-size: 13px; font-weight: 500; color: var(--ink-3); }
.leg .lt svg { align-self: center; color: var(--ink-3); }
.leg .lc { font-size: 13px; font-weight: 600; color: var(--ink-2); }

/* expenses */
.hero-num { display: flex; flex-direction: column; gap: 2px; }
.hero-num .lbl { font-size: 13px; color: var(--ink-3); font-weight: 500; }
.hero-num .val { font-family: var(--font-display); font-size: 34px; font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; }
.hero-num .val small { font-size: 16px; font-weight: 600; color: var(--ink-3); margin-left: 4px; }
.seg { display: inline-flex; padding: 3px; border-radius: 999px; background: var(--surface-2); align-self: flex-start; }
.seg button { border: 0; background: transparent; min-height: 36px; padding: 0 14px; border-radius: 999px; font-size: 14px; font-weight: 600; color: var(--ink-2); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.pay { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; padding: 10px 0; border-top: 1px solid var(--line); align-items: center; }
.pay:first-child { border-top: 0; }
.pay .who { font-weight: 600; overflow-wrap: anywhere; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.pay .who .arrow { color: var(--ink-3); }
.pay .amt { font-family: var(--font-display); font-weight: 700; font-size: 17px; font-variant-numeric: tabular-nums; }
.bal { display: grid; grid-template-columns: 92px minmax(0, 1fr) 88px; gap: 10px; align-items: center; padding: 6px 0; font-size: 14px; }
.bal.hd { padding: 0 0 2px; }
.bal.hd .bhd { display: grid; grid-template-columns: 1fr 1fr; white-space: nowrap; font-size: 12px; font-weight: 600; color: var(--ink-3); }
.bal.hd .bhd span:first-child { text-align: right; padding-right: 6px; border-right: 1px solid var(--line); }
.bal.hd .bhd span:last-child { padding-left: 6px; }
.bal .bn { font-weight: 600; overflow-wrap: anywhere; line-height: 1.2; }
.bal .bt { position: relative; height: 10px; }
.bal .bt::before { content: ""; position: absolute; left: 50%; top: -3px; bottom: -3px; width: 1px; background: var(--line); }
.bal .bf { position: absolute; top: 0; bottom: 0; border-radius: 3px; }
.bal .bf.pos { left: 50%; background: var(--pos); }
.bal .bf.neg { right: 50%; background: var(--neg); }
.bal .bv { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
.bal .bv.pos { color: var(--pos); }
.bal .bv.neg { color: var(--neg); }
.bfly { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: center; gap: 4px 0; padding: 6px 0; font-size: 14px; }
.bfly .bn { grid-column: 1 / -1; font-weight: 600; font-size: 14px; line-height: 1.2; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bfly .half { display: flex; align-items: center; gap: 6px; min-width: 0; height: 22px; }
.bfly .half.paid { flex-direction: row-reverse; border-right: 1px solid var(--line); }
.bfly .bf { height: 100%; flex: none; display: flex; align-items: center; }
.bfly .half.paid .bf { background: var(--bar); border-radius: 5px 0 0 5px; justify-content: flex-start; }
.bfly .half.share .bf { background: var(--accent); border-radius: 0 5px 5px 0; justify-content: flex-end; }
.bfly .v { font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--ink-2); white-space: nowrap; }
.bfly .bf.in .v { padding: 0 7px; }
.bfly .half.paid .bf.in .v { color: var(--on-bar); }

  var Y = '#F6B92B', B = '#F2643D', E = '#1B2340';

    if (cur !== base) h += '<p class="hint" style="margin:-8px 0 0;font-size:12px;color:var(--ink-3)">Converted at about ' + rate.toLocaleString('en-SG', { maximumFractionDigits: 2 }) + ' ' + esc(local) + ' per ' + esc(base) + ', the average rate of this trip\'s ' + esc(local) + ' expenses.</p>';

  /* ---------- inbox: chat-style requests that Claude applies on a schedule ----------

  var CAN_RUN = canCallServer();

  function snip(t, n) { t = String(t || '').replace(/\s+/g, ' ').trim(); return t.length > n ? t.slice(0, n - 1) + '…' : t; }
  function inboxRow(r) { return (state.inbox || []).filter(function (m) { return m.row === r; })[0]; }
  function meOk() { return !!state.me && travellers().indexOf(state.me) > -1; }

  function renderRequests() {

  function sheetClose() { var sh = document.getElementById('sheet'); sh.hidden = true; sh.innerHTML = ''; }

      travellers().map(function (n) { return '<button type="button" class="btn" data-me="' + esc(n) + '" data-me-send="1">' + esc(n) + '</button>'; }).join('') +
      '</div><button type="button" class="linkbtn" data-sheet-close style="align-self:flex-start">Cancel</button>');
  }
  function sendDraft() {
    var text = (state.draft || '').trim();

    callServer('postInbox', [window.__tripKey || META.key, window.__tripCred, state.me, text, state.replyTo || 0],
      function (json) {

      function (err) {

  // the chat bar is drawn once and only updated here, so typing is never interrupted by a re-render

  // Enter sends (the keyboard shows "send"); Shift+Enter starts a new line
  document.addEventListener('keydown', function (e) {
    if (e.target.id === 'chat-text' && e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); sendDraft(); }
  });
  document.addEventListener('submit', function (e) {
    if (e.target.id !== 'chatbar') return;
    e.preventDefault(); sendDraft();
  });

  /* ---------- Group: the trip, open votes (task 14), recent changes and people ---------- */
  function renderGroup() {
    var h = overviewHtml(DATA.trip), names = travellers();
    if (CAN_RUN) {
      if (state.inbox === null) loadInbox();
      var done = (state.inbox || []).filter(function (m) { return /^done$/i.test(m.status || ''); }).slice(-5).reverse();
      h += '<section class="section"><h3>Recent changes</h3>' + (state.inbox === null ? '<p class="hint">Loading…</p>' : done.length ? '<div>' + done.map(function (m) {
        return '<div class="msg"><div class="mh"><span><b>' + esc(m.from) + '</b> · ' + esc(m.done || m.time) + '</span><span class="pill booked">Done</span></div><div class="mt">' + esc(snip(m.text, 140)) + '</div></div>';
      }).join('') + '</div>' : '<div class="empty-duck">' + DUCKS('pair', 28) + '<p class="hint">No changes yet. All quiet on the pond.</p></div>') +
        '<button type="button" class="btn" data-go="requests" style="justify-content:center">See all messages</button></section>';
    }
    if (names.length) {
      h += '<section class="section"><h3>People</h3><div class="list">' + names.map(function (n) {
        var me = n === state.me;
        return '<div class="person"><span class="av">' + esc(n.slice(0, 3)) + '</span><span class="pn">' + esc(n) + (me ? ' <span class="hint">(you)</span>' : '') + '</span></div>';
      }).join('') + '</div>' + (meOk() ? '' : '<p class="hint">Tell us which one is you in <a href="#me" data-go="me">Me</a>.</p>') + '</section>';
    }
    return h;
  }

  /* ---------- shell ---------- */
  function refreshedText() {
    try {
      var d = new Date(DATA.generated_at);
      return (LIVE ? 'Loaded ' : 'Updated ') + new Intl.DateTimeFormat('en-GB', { timeZone: TZ, weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit', hour12: false }).format(d) + ' ' + PLACE_TIME;
    } catch (e) { return 'Updated ' + DATA.generated_at; }
  }
  var TABS = ['group', 'bookings', 'plan', 'expenses', 'me'];
  function render() {
    var t = state.tab, n = travellers().length;
    var eyebrows = { group: 'Group', bookings: 'Bookings', plan: 'Plan', expenses: 'Expenses', me: 'Me', requests: 'Messages' };
    document.getElementById('eyebrow').textContent = eyebrows[t];
    document.getElementById('title').textContent = t === 'group' ? META.name + (n ? ' · ' + n + ' traveller' + (n === 1 ? '' : 's') : '') :
      t === 'me' ? (meOk() ? state.me : 'Me') : t === 'requests' ? 'Messages' : tripTitle();
    TABS.forEach(function (x) {
      var a = document.getElementById('tab-' + x);
      if (x === t || (t === 'requests' && x === state.from)) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
    });
    renderDays();
    var body = t === 'plan' ? renderPlan() : t === 'group' ? renderGroup() : t === 'bookings' ? renderBookings() :
      t === 'me' ? renderMe() : t === 'requests' ? renderRequests() : renderExpenses();
    body += '<div class="foot"><div class="trailrow" aria-hidden="true"><i></i>' + DUCKS('pair', 22) + '</div><span class="tag">We plan. You just follow.</span><span>' + esc(refreshedText()) + (LIVE ? ' · Pull down to refresh' : '') + '</span></div>';
    view.innerHTML = body;
    drawChat();
  }
  // old links: #trip was the Trip tab (now Bookings), #inbox the inbox (now Messages)
  function fromHash() {
    var h = (location.hash || '').replace('#', '');
    if (h === 'trip') h = 'bookings';
    if (h === 'inbox') h = 'requests';
    state.tab = TABS.indexOf(h) > -1 || h === 'requests' ? h : 'plan';
  }
  function pickDay() {
    var today = tokyoToday();
    var saved = store(SK + 'day');
    var savedOn = store(SK + 'day-set');
    if (days.some(function (d) { return d.date === today; }) && savedOn !== today) return today;
    if (saved && days.some(function (d) { return d.date === saved; })) return saved;
    return days.some(function (d) { return d.date === today; }) ? today : days[0].date;
  }

  function goTab(t) {
    if (t === 'requests' && state.tab !== 'requests') state.from = state.tab;
    if (t !== 'requests') state.toast = '';
    state.tab = t;
    try { history.replaceState(null, '', '#' + t); } catch (err) {}
    render(); window.scrollTo(0, 0);
  }
  document.addEventListener('click', function (e) {
    var nav = e.target.closest('nav.tabbar a');
    if (nav) { e.preventDefault(); goTab(nav.getAttribute('href').slice(1)); return; }
    if (e.target.closest('#chat-hist')) { e.preventDefault(); goTab(state.tab === 'requests' ? (state.from || 'plan') : 'requests'); return; }
    var go = e.target.closest('[data-go]');
    if (go) { e.preventDefault(); goTab(go.getAttribute('data-go')); return; }
    var b = e.target.closest('[data-day]');
    if (b) { state.day = b.getAttribute('data-day'); store(SK + 'day', state.day); store(SK + 'day-set', tokyoToday()); render(); window.scrollTo(0, 0); return; }
    var g = e.target.closest('[data-goto]');
    if (g && g.getAttribute('data-goto')) { state.day = g.getAttribute('data-goto'); store(SK + 'day', state.day); store(SK + 'day-set', tokyoToday()); goTab('plan'); return; }
    var me = e.target.closest('[data-me]');
    if (me) {
      state.me = me.getAttribute('data-me'); store(SK + 'me', state.me);
      if (me.hasAttribute('data-me-send')) { sheetClose(); render(); sendDraft(); return; }
      render(); return;
    }
    if (e.target.closest('[data-sheet-close]') || e.target.id === 'sheet') { sheetClose(); return; }
    var rr = e.target.closest('[data-ibx-re]');
    if (rr) { state.replyTo = Number(rr.getAttribute('data-ibx-re')) || 0; drawChat(); var t = document.getElementById('chat-text'); if (t) t.focus(); return; }
    if (e.target.closest('[data-ibx-cancel]')) { state.replyTo = 0; drawChat(); return; }
    var s = e.target.closest('[data-settle]');
    if (s) { state.settle = s.getAttribute('data-settle'); store(SK + 'settle', state.settle); render(); return; }
    var sb = e.target.closest('[data-shares]');
    if (sb) { state.shares = sb.getAttribute('data-shares'); store(SK + 'shares', state.shares); render(); return; }
    if (e.target.closest('[data-tx-all]')) { state.txAll = !state.txAll; render(); return; }
    var tb = e.target.closest('[data-theme-set]');
    if (tb) { if (window.__setTheme) window.__setTheme(tb.getAttribute('data-theme-set')); render(); return; }
    var cp = e.target.closest('[data-copy]');
    if (cp) {
      var txt = cp.getAttribute('data-copy'), lab = cp.lastChild;
      var done = function () { var was = lab.textContent; lab.textContent = 'Copied'; setTimeout(function () { lab.textContent = was; }, 1600); };
      try { navigator.clipboard.writeText(txt).then(done, function () {}); } catch (err) {}
      return;
    }
    var cb = e.target.closest('[data-cur]');
    if (cb) { state.cur = cb.getAttribute('data-cur'); store(SK + 'cur', state.cur); render(); return; }
  });
  window.addEventListener('hashchange', function () { fromHash(); render(); window.scrollTo(0, 0); });

  state.day = pickDay();
  state.settle = store(SK + 'settle') === 'people' ? 'people' : 'groups';
  state.cur = store(SK + 'cur');
  state.shares = store(SK + 'shares') === 'people' ? 'people' : 'groups';
  state.me = store(SK + 'me');
  fromHash();
  render();
  if (CAN_RUN && state.inbox === null) loadInbox();

  /* ---------- pull down to refresh ---------- */
  window.__tripApp = {
    update: function (nd) {
      nd.boot = nd.boot || DATA.boot;
      markFerries(nd.plan && nd.plan.days);
      DATA = nd; days = DATA.plan.days; LIVE = DATA.mode === 'live';
      document.getElementById('sub').textContent = '';
      if (!days.some(function (d) { return d.date === state.day; })) state.day = pickDay();
      if (CAN_RUN) { state.toast = ''; inboxLoading = false; loadInbox(); }
      var y = window.scrollY; render(); window.scrollTo(0, y);
    }
  };
  var ptr = document.getElementById('ptr'), ptrT = document.getElementById('ptr-t');
  var PULL = 80, startY = null, startX = 0, pull = 0, busy = false;
  function ptrShow(d) {
    ptr.className = 'ptr' + (d >= PULL ? ' ready' : '');
    ptr.style.transform = 'translate(-50%, ' + (Math.min(d, PULL + 20) * 0.8 - 60) + 'px)';
    ptr.style.opacity = String(Math.min(1, d / PULL));
    ptrT.textContent = d >= PULL ? 'Release to refresh' : 'Pull to refresh';
  }
  function ptrHide() { ptr.className = 'ptr done'; ptr.style.transform = ''; ptr.style.opacity = ''; }
  function doRefresh() {
    busy = true; ptr.className = 'ptr busy'; ptr.style.transform = ''; ptr.style.opacity = ''; ptrT.textContent = 'Rounding up the latest…';
    function finish(text) { ptrT.textContent = text; setTimeout(function () { busy = false; ptrHide(); }, text === 'Updated' ? 600 : 2200); }
    if (!(canCallServer() && window.__tripCred)) { location.reload(); return; }
    callServer('refreshTrip', [window.__tripKey || META.key, window.__tripCred],
      function (json) { var nd = JSON.parse(json); if (window.__tripSaveLast) window.__tripSaveLast(nd); window.__tripApp.update(nd); finish('Updated'); },
      function () { finish("Couldn't refresh. Check your connection."); });
  }
  document.addEventListener('touchstart', function (e) {
    startY = (!busy && window.scrollY <= 0 && e.touches.length === 1) ? e.touches[0].clientY : null;
    if (startY !== null) startX = e.touches[0].clientX;
    pull = 0;
  }, { passive: true });
  document.addEventListener('touchmove', function (e) {
    if (startY === null) return;
    var dy = e.touches[0].clientY - startY, dx = Math.abs(e.touches[0].clientX - startX);
    if (dy <= 0 || dx > dy || window.scrollY > 0) { if (pull) ptrHide(); startY = null; pull = 0; return; }
    pull = dy * 0.6; ptrShow(pull);
  }, { passive: true });
  document.addEventListener('touchend', function () {
    if (startY === null) return;
    startY = null;
    if (pull >= PULL) doRefresh(); else if (pull) ptrHide();
    pull = 0;
  });
}

/* ---------- PIN gate (Apps Script build: data is fetched only after the PIN checks out) ---------- */
(function () {
  'use strict';
  var raw = document.getElementById('trip-data').textContent.trim();
  if (raw && raw !== 'null') { startApp(JSON.parse(raw)); return; }
  var boot = null;
  try { boot = JSON.parse(document.getElementById('trip-boot').textContent.trim() || 'null'); } catch (e) {}
  // GitHub Pages copy: the page is static, so it reads the link itself and talks to Apps Script's JSON API
  if (boot && boot.api) {
    var q = new URLSearchParams(location.search), ksMap = {};
    String(q.get('ks') || '').split(',').slice(0, 30).forEach(function (part) {
      var m = /^([A-Za-z0-9_.-]{1,64}):([A-Za-z0-9_-]{16,64})$/.exec(part.trim());
      if (m) ksMap[m[1]] = m[2];
    });
    var here = location.origin + location.pathname;
    window.__api = boot.api;
    boot = { api: boot.api, pages: true, url: here, launcher: here, any: true,
      trip: /^[A-Za-z0-9_.-]{1,64}$/.test(q.get('trip') || '') ? q.get('trip') : null,
      k: /^[A-Za-z0-9_-]{16,64}$/.test(q.get('k') || '') ? q.get('k') : null,
      ks: ksMap, add: q.get('add') === '1', setup: q.get('setup') === '1' };
  }
  function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) { return null; } }
  function esc(x) { return String(x == null ? '' : x).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  var view = document.getElementById('view');
  document.getElementById('days').hidden = true;
  document.querySelector('nav.tabbar').hidden = true;
  document.getElementById('eyebrow').textContent = 'Trips';
  document.getElementById('title').textContent = 'Just Follow';
  if (!boot || !boot.any) {
    document.getElementById('sub').textContent = '';
    view.innerHTML = '<div class="section gate"><h3>No trip set up yet</h3><p class="hint">Ask your organiser to add the trip.</p></div>';
    return;
  }
  // Trips this device has unlocked before: localStorage 'trip-<key>-pin' holds 'k:<key>'. Only these are ever listed.
  function savedCreds() {
    var out = {};
    try {
      for (var i = 0; i < localStorage.length; i++) {
        var m = /^trip-(.+)-pin$/.exec(localStorage.key(i) || '');
        var v = m ? localStorage.getItem(localStorage.key(i)) : '';
        if (m && v && v.indexOf('k:') === 0) out[m[1]] = v;
      }
    } catch (e) {}
    // keys carried in the link (ks=trip:key,...): a Home Screen icon forgets localStorage when closed
    Object.keys(boot.ks || {}).forEach(function (k) { if (!out[k]) out[k] = 'k:' + boot.ks[k]; });
    return out;
  }
  var want = boot.trip || '';
  // Add to Home Screen steps (Trip tab and the ?setup=1 screen)
  var SHARE_IC = '<svg class="ic" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-label="Share"><path d="M12 3v12"/><path d="M8 7l4-4 4 4"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg>';
  var HS_IPHONE = '<b>iPhone:</b> in Safari, tap Share ' + SHARE_IC + ', then <b>Add to Home Screen</b> and <b>Add</b>.';
  var HS_ANDROID = '<b>Android:</b> in Chrome, tap the menu <b>⋮</b>, then <b>Add to Home screen</b>.';
  window.__oooHsHow = HS_IPHONE + '<br>' + HS_ANDROID;
  // App icon (mother duck and duckling on night ink) drawn inline (no image request, so it can't show as a broken image)
  var LOGO = '<svg viewBox="0 0 512 512" aria-hidden="true"><rect width="512" height="512" fill="#1B2340"/><g transform="translate(35 113) scale(4.6)">' +
    '<ellipse cx="28" cy="38" rx="20" ry="12" fill="#F6B92B"/><circle cx="44" cy="22" r="10" fill="#F6B92B"/><path d="M53 20l10 3l-10 3z" fill="#F2643D"/><circle cx="47" cy="19" r="2.2" fill="#1B2340"/>' +
    '<ellipse cx="70" cy="44" rx="10" ry="6" fill="#F6B92B"/><circle cx="77" cy="36" r="5" fill="#F6B92B"/><path d="M81 34.5l7 1.5l-7 2z" fill="#F2643D"/><circle cx="78.5" cy="34.5" r="1.3" fill="#1B2340"/></g></svg>';
  window.__oooLogo = LOGO;
  view.innerHTML = '<div class="splash" id="splash" hidden>' + LOGO + '<h3>Just Follow</h3><p>Lining up the ducklings…</p>' + DUCKS('row', 40) + '</div>' +
    '<form class="section gate" id="gate" autocomplete="off">' +
    '<h3>Open your trip</h3><p class="hint">Enter the PIN your organiser shared. We’ll remember it after that, so you can just follow.</p>' +
    '<label for="pin" class="sr">Trip PIN</label>' +
    '<input id="pin" name="pin" type="password" inputmode="numeric" autocomplete="off" placeholder="PIN" required>' +
    '<button type="submit" class="btn primary" id="unlock">Open trip</button>' +
    '<p class="hint" id="gate-msg" role="status" aria-live="polite"></p></form>';
  var form = document.getElementById('gate'), input = document.getElementById('pin'), msg = document.getElementById('gate-msg'), btn = document.getElementById('unlock');
  var splash = document.getElementById('splash'), sub = document.getElementById('sub');
  if (boot.setup) {
    var keepQ = new URLSearchParams(location.search); keepQ.delete('setup');
    try { history.replaceState(null, '', location.pathname + (keepQ.toString() ? '?' + keepQ.toString() : '')); } catch (e) {}
    view.insertAdjacentHTML('afterbegin', '<div class="section gate" id="hs-steps"><div class="hs-head">' + window.__oooLogo + '<div><h3>Add Just Follow to your Home Screen</h3></div></div>' +
      '<ol class="steps"><li><span>' + HS_IPHONE + '</span></li><li><span>' + HS_ANDROID + '</span></li></ol>' +
      '<p class="hint">The icon opens every trip you have unlocked. Keep it to yourself: it works like your PINs.</p>' +
      '<p class="hint"><a href="' + esc(location.pathname + (keepQ.toString() ? '?' + keepQ.toString() : '')) + '">Done, open Just Follow</a></p></div>');
    document.getElementById('days').hidden = true;
    document.getElementById('gate').hidden = true;
    sub.textContent = '';
    return;
  }
  function showSplash(on) {
    splash.hidden = !on; form.hidden = on;
    sub.textContent = on ? '' : (boot.add ? 'Enter the PIN of the trip you want to add.' : 'Enter the trip PIN to open the plan.');
  }
  // Pages copy: the last trip opened on this device, shown at once next time while the server checks for changes
  function saveLast(d) {
    if (!boot.pages) return;
    try { var c = JSON.parse(JSON.stringify(d)); delete c.boot; localStorage.setItem('ooo-last', JSON.stringify(c)); } catch (e) {}
  }
  function forgetLast() { store('ooo-last', null); }
  window.__tripSaveLast = function (nd) { if (boot.pages) { try { var c = JSON.parse(localStorage.getItem('ooo-last') || 'null'); if (c && c.meta && nd.meta && c.meta.key === nd.meta.key) { nd.deviceKey = c.deviceKey; nd.mine = c.mine; nd.keys = c.keys; saveLast(nd); delete nd.mine; delete nd.keys; } } catch (e) {} } };
  function lastCopy() {
    if (!boot.pages || boot.add) return null;
    var c = null; try { c = JSON.parse(localStorage.getItem('ooo-last') || 'null'); } catch (e) {}
    if (!c || !c.meta || !c.deviceKey) return null;
    var k = c.meta.key, creds = savedCreds();
    // only a trip this device (or this link) still holds a key for, and the one the link asks for if it names one
    if (want && want !== k) return null;
    if (creds[k] !== 'k:' + c.deviceKey && !(want === k && boot.k === c.deviceKey)) return null;
    return c;
  }
  var MSG = { wrong: "That PIN didn't work. Check it and try again.", locked: 'Too many wrong tries. Take a 10-minute paddle, then try again.', setup: "This trip isn’t ready yet. Ask your organiser to finish setting it up." };
  // Server answered with the trip: remember its keys, put them in the link, show it.
  // A stale answer (last good copy from the cache) is shown at once, then refreshed in the background.
  function opened(d, pin, saved) {
    var key = d.meta.key;
    var cred = d.deviceKey ? 'k:' + d.deviceKey : pin;
    // forget saved keys that no longer work (that trip's PIN was changed)
    var ok = {}; (d.mine || []).forEach(function (t) { ok[t.key] = 1; });
    Object.keys(saved).forEach(function (k) { if (!ok[k]) store('trip-' + k + '-pin', null); });
    // a PIN shared by several trips unlocks all of them: remember each one
    Object.keys(d.keys || {}).forEach(function (k) { store('trip-' + k + '-pin', 'k:' + d.keys[k]); });
    store('trip-' + key + '-pin', cred); window.__tripCred = cred; window.__tripKey = key;
    // Put the trip and key in the page link, so a Home Screen icon added from here opens this trip without the PIN
    // With several trips, the link carries all their keys (ks) and no trip, so the icon opens the current trip and lists the rest
    var ks = Object.keys(d.keys || {}).map(function (k) { return k + ':' + d.keys[k]; }).join(',');
    if (d.deviceKey && window.google && google.script && google.script.history) {
      try {
        google.script.history.replace(null, (d.mine || []).length > 1 ? { ks: ks } : { trip: key, k: d.deviceKey }, '');
      } catch (e) {}
    } else if (d.deviceKey && boot.pages) {
      var lq = (d.mine || []).length > 1 ? '?ks=' + encodeURIComponent(ks).replace(/%3A/g, ':').replace(/%2C/g, ',') : '?trip=' + encodeURIComponent(key) + '&k=' + d.deviceKey;
      try { history.replaceState(null, '', location.pathname + lq + location.hash); } catch (e) {}
    }
    var stale = d.stale;
    if (!stale) saveLast(d);
    d.boot = { url: boot.url, trips: d.mine || [], ks: ks, launcher: boot.launcher || '', pages: !!boot.pages };
    delete d.mine; delete d.keys; delete d.stale;
    startApp(d);
    if (stale && canCallServer()) {
      sub.textContent = 'Checking for changes…';
      var all = savedCreds();
      callServer('openTrip', [key, cred, all, false],
        function (json) { if (json) opened(JSON.parse(json), cred, all); },
        function (err) {
          // the trip's PIN was changed since this copy was kept: drop it and ask again
          if (boot.pages && /wrong|needpin|setup/.test(String(err && err.message || err))) { forgetLast(); store('trip-' + key + '-pin', null); location.replace(location.pathname); return; }
          sub.textContent = "Couldn't check for changes. Pull down to refresh.";
        });
    }
  }
  function attempt(pin, auto) {
    if (!canCallServer()) { showSplash(false); msg.textContent = 'Open this page from its web app link.'; return; }
    var saved = savedCreds();
    btn.disabled = true; msg.textContent = auto ? 'Opening…' : 'Checking…';
    callServer('openTrip', [want, pin, saved, true],
      function (json) { opened(JSON.parse(json), pin, saved); },
      function (err) {
        showSplash(false);
        btn.disabled = false;
        var m = String(err && err.message || err);
        var key = m.indexOf('needpin') > -1 ? 'needpin' : m.indexOf('locked') > -1 ? 'locked' : m.indexOf('setup') > -1 ? 'setup' : m.indexOf('wrong') > -1 ? 'wrong' : null;
        if (key === 'needpin') { msg.textContent = ''; input.focus(); return; }
        if (key === 'wrong' && want && pin.indexOf('k:') === 0) store('trip-' + want + '-pin', null);
        msg.textContent = key ? (auto && key === 'wrong' ? 'The saved PIN no longer works. Enter the new one, then add the page to your Home Screen again.' : MSG[key]) : 'Could not load the trip. Check your connection and try again.';
        input.focus();
      });
  }
  form.addEventListener('submit', function (e) { e.preventDefault(); var v = input.value.trim(); if (v) attempt(v, false); });
  // Home Screen link carries its own key; otherwise try this device's saved keys (no PIN typed)
  var first = boot.k && want ? 'k:' + boot.k : '';
  if (boot.add) { showSplash(false); input.focus(); }
  // the server already put the cached trip in the page (Home Screen link): show it now, refresh in the background
  else if (boot.pre && boot.pre.meta) { var pre = boot.pre; pre.stale = true; opened(pre, first, savedCreds()); }
  else if (lastCopy()) { var lc = lastCopy(); lc.stale = true; opened(lc, 'k:' + lc.deviceKey, savedCreds()); }
  else if (first || Object.keys(savedCreds()).length) { showSplash(true); attempt(first, true); }
  else showSplash(false), input.focus();
})();
</script>
