<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="OOO">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F3F5F9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1424" media="(prefers-color-scheme: dark)">
<meta name="robots" content="noindex">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-512.png">
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://script.googleusercontent.com">
<title>OOO</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- fonts load without holding up the first paint (system fonts until they arrive) -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=Noto+Sans+JP:wght@400;600&display=swap" media="print" onload="this.media='all'">
<style>
/* Layout: one phone column; sticky header + day strip, timeline cards, bottom tab bar. Indigo ink on cool paper, persimmon for anything still to book. */
:root {
  --bg: #F3F5F9;
  --surface: #FFFFFF;
  --surface-2: #E9EDF4;
  --line: #D8DEE8;
  --ink: #18213A;
  --ink-2: #4A5470;
  --ink-3: #66708A;
  --accent: #27408B;
  --accent-soft: #E3E9F7;
  --on-accent: #FFFFFF;
  --persimmon: #B4460F;
  --persimmon-soft: #FBE7DA;
  --good: #1E6B46;
  --good-soft: #DDF0E5;
  --amber: #8A5A00;
  --amber-soft: #F7ECCF;
  --neg: #A3301F;
  --pos: #1E6B46;
  --bar: #9AA9CF;
  --font-display: 'Space Grotesk', 'Inter', system-ui, sans-serif;
  --font-body: 'Inter', 'Noto Sans JP', system-ui, -apple-system, 'Hiragino Sans', sans-serif;
  --r: 14px;
  --tabbar-h: 64px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1424; --surface: #182036; --surface-2: #222B44; --line: #2E3854;
    --ink: #E8ECF6; --ink-2: #B5BED6; --ink-3: #98A2BD;
    --accent: #9DB3F5; --accent-soft: #26335A; --on-accent: #0F1424;
    --persimmon: #FFA978; --persimmon-soft: #4A2716;
    --good: #7FD9A8; --good-soft: #173A2A; --amber: #F2C86B; --amber-soft: #3F3216;
    --neg: #FF9C8C; --pos: #7FD9A8; --bar: #5A6C9E;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1424; --surface: #182036; --surface-2: #222B44; --line: #2E3854;
  --ink: #E8ECF6; --ink-2: #B5BED6; --ink-3: #98A2BD;
  --accent: #9DB3F5; --accent-soft: #26335A; --on-accent: #0F1424;
  --persimmon: #FFA978; --persimmon-soft: #4A2716;
  --good: #7FD9A8; --good-soft: #173A2A; --amber: #F2C86B; --amber-soft: #3F3216;
  --neg: #FF9C8C; --pos: #7FD9A8; --bar: #5A6C9E;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 15px; line-height: 1.45;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
a { color: var(--accent); text-underline-offset: 2px; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.wrap {
  max-width: 560px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.num { font-variant-numeric: tabular-nums; }

/* header */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: var(--bg);
  border-bottom: 1px solid var(--line);
}
.top .wrap { padding-block: 12px 10px; display: flex; flex-direction: column; gap: 2px; }
.eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
.top h1 { margin: 0; font-family: var(--font-display); font-size: 22px; line-height: 1.2; font-weight: 700; text-wrap: balance; }
.top .sub { font-size: 13px; color: var(--ink-3); }
.top .sub:empty { display: none; }
.days {
  display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none;
  padding-block: 10px 2px; scroll-snap-type: x proximity;
}
.days::-webkit-scrollbar { display: none; }
.days[hidden] { display: none; }
.daychip {
  flex: 0 0 auto; scroll-snap-align: start;
  min-width: 56px; min-height: 52px; padding: 6px 10px;
  border-radius: 12px; border: 1px solid var(--line); background: var(--surface);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0;
  cursor: pointer;
}
.daychip .dw { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); }
.daychip .dn { font-family: var(--font-display); font-size: 19px; font-weight: 700; line-height: 1.1; }
.daychip .dot { width: 6px; height: 6px; border-radius: 3px; background: transparent; margin-top: 2px; }
.daychip .dot.todo { background: var(--persimmon); }
.daychip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.daychip[aria-pressed="true"] .dw { color: var(--on-accent); opacity: .85; }
.daychip[aria-pressed="true"] .dot.todo { background: var(--on-accent); }
.daychip.today:not([aria-pressed="true"]) { border-color: var(--accent); }

main { padding-bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom, 0px) + 24px); }
main .wrap { padding-block: 16px 0; display: flex; flex-direction: column; gap: 14px; }

/* day head */
.dayhead { display: flex; flex-direction: column; gap: 6px; }
.dayhead h2 { margin: 0; font-family: var(--font-display); font-size: 24px; line-height: 1.2; font-weight: 700; }
.daymeta { display: flex; flex-wrap: wrap; gap: 6px; }
.meta {
  display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px;
  border-radius: 999px; background: var(--surface-2); color: var(--ink-2); font-size: 13px; font-weight: 500;
}
.meta.todo { background: var(--persimmon-soft); color: var(--persimmon); }
.meta.today { background: var(--accent); color: var(--on-accent); }
.meta svg { flex: 0 0 auto; }

/* timeline */
.timeline { display: flex; flex-direction: column; gap: 10px; }
.row { display: grid; grid-template-columns: 50px minmax(0, 1fr); gap: 10px; align-items: start; }
.time { padding-top: 14px; font-family: var(--font-display); font-size: 15px; font-weight: 600; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.time.empty::before { content: "·"; color: var(--ink-3); padding-left: 12px; }
.card {
  min-width: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r);
  padding: 12px 14px; display: flex; flex-direction: column; gap: 8px;
}
.card.now { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.cardtop { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.kind { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); }
.pill { display: inline-flex; align-items: center; padding: 3px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.pill.booked { background: var(--good-soft); color: var(--good); }
.pill.to_book { background: var(--persimmon-soft); color: var(--persimmon); }
.pill.bookable { background: var(--surface-2); color: var(--ink-2); }
.pill.walk_in { background: var(--surface-2); color: var(--ink-2); }
.pill.optional { background: transparent; border: 1px dashed var(--ink-3); color: var(--ink-2); }
.pills { display: inline-flex; gap: 6px; flex-wrap: wrap; }
.name { font-size: 17px; font-weight: 600; line-height: 1.3; text-wrap: balance; overflow-wrap: anywhere; }
.facts { display: flex; flex-direction: column; gap: 4px; margin: 0; padding: 0; list-style: none; }
.fact { display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 8px; font-size: 14px; color: var(--ink-2); }
.fact svg { margin-top: 2px; color: var(--ink-3); }
.fact span { min-width: 0; overflow-wrap: anywhere; }
.fact .fl { display: block; }
.fact .fl + .fl { margin-top: 4px; }
.details { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 3px; font-size: 14px; color: var(--ink); }
.details li { overflow-wrap: anywhere; }
.details li.h { list-style: none; margin-left: -18px; font-weight: 600; padding-top: 4px; }
/* nested lines: d1/d2 are sub-bullets, num keeps the doc's own "1." numbering, gap marks a blank line in the doc */
.details li.d1, .notes li.d1 { margin-left: 18px; list-style-type: circle; }
.details li.d2, .notes li.d2 { margin-left: 36px; list-style-type: square; }
.details li.d3, .notes li.d3 { margin-left: 54px; list-style-type: square; }
.details li.num, .notes li.num { list-style: none; }
.details li.gap, .notes li.gap { margin-top: 6px; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.btn {
  display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 14px;
  border-radius: 999px; border: 1px solid var(--line); background: var(--surface);
  font-size: 14px; font-weight: 600; text-decoration: none; color: var(--accent);
}
.btn.primary { background: var(--accent-soft); border-color: transparent; }
.btn.pbtn { padding: 0 11px; }
.gate { max-width: 360px; margin: 24px auto 0; width: 100%; }
.gate + .gate { margin-top: 0; }
.gate input { font: inherit; font-size: 20px; letter-spacing: .2em; min-height: 48px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); width: 100%; }
.gate .btn { justify-content: center; min-height: 48px; cursor: pointer; border: 0; }
.gate .btn:disabled { opacity: .6; }
.gate[hidden], .splash[hidden] { display: none; }
.splash { text-align: center; padding: 48px 0 0; color: var(--ink-2); }
.splash svg { width: 84px; height: 84px; border-radius: 20px; display: block; margin: 0 auto 14px; }
.splash h3 { font-family: var(--font-display); font-size: 26px; margin: 0 0 4px; color: var(--ink); }
.splash p { margin: 0; }
.pk { display: inline-flex; align-items: center; justify-content: center; width: 18px; height: 18px; border-radius: 4px; background: var(--accent); color: var(--on-accent); font-family: var(--font-display); font-size: 12px; font-weight: 700; line-height: 1; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.drive-chip { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--ink-2); font-weight: 500; }
details.more { border-top: 1px solid var(--line); padding-top: 6px; }
details.more > summary {
  list-style: none; cursor: pointer; min-height: 36px; display: flex; align-items: center; justify-content: space-between;
  font-size: 14px; font-weight: 600; color: var(--ink-2);
}
details.more > summary::-webkit-details-marker { display: none; }
details.more > summary::after { content: ""; width: 8px; height: 8px; border-right: 2px solid currentColor; border-bottom: 2px solid currentColor; transform: rotate(45deg); margin-right: 4px; transition: transform .15s; }
details.more[open] > summary::after { transform: rotate(-135deg); }
.notes { margin: 4px 0 6px; padding-left: 18px; display: flex; flex-direction: column; gap: 4px; font-size: 14px; color: var(--ink-2); }
.notes li { overflow-wrap: anywhere; }
.notes li.strong { font-weight: 600; color: var(--ink); }
.backup { margin: 6px 0; padding: 10px 12px; border-radius: 10px; background: var(--surface-2); display: flex; flex-direction: column; gap: 6px; }
.backup .bname { font-weight: 600; font-size: 15px; overflow-wrap: anywhere; }

/* compact row for drives, flights etc */
.mini {
  min-width: 0; display: flex; align-items: center; gap: 10px; padding: 10px 12px;
  border-radius: var(--r); border: 1px dashed var(--line); color: var(--ink-2);
}
.mini .mt { min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 2px; }
.mini .mn { font-weight: 600; color: var(--ink); font-size: 15px; overflow-wrap: anywhere; }
.mini .ms { font-size: 13px; overflow-wrap: anywhere; }
.mini a.ic { flex: 0 0 auto; width: 40px; height: 40px; border-radius: 20px; display: inline-flex; align-items: center; justify-content: center; background: var(--accent-soft); color: var(--accent); }

/* sections on trip / expenses */
.section { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.section h3 { margin: 0; font-family: var(--font-display); font-size: 18px; font-weight: 700; }
.section .hint { font-size: 13px; color: var(--ink-3); margin: -4px 0 0; }
.list { display: flex; flex-direction: column; }
.li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; padding: 10px 0; border-top: 1px solid var(--line); align-items: baseline; }
.li:first-child { border-top: 0; padding-top: 2px; }
.li .t { font-weight: 600; overflow-wrap: anywhere; }
.li .s { grid-column: 1 / -1; font-size: 13px; color: var(--ink-2); overflow-wrap: anywhere; }
.li .r { font-size: 13px; color: var(--ink-2); font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
.todo-item { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); }
.todo-item:first-child { border-top: 0; padding-top: 2px; }
.todo-item button.when { all: unset; cursor: pointer; font-family: var(--font-display); font-weight: 700; font-size: 14px; color: var(--accent); line-height: 1.2; }
.todo-item button.when small { display: block; font-family: var(--font-body); font-weight: 500; font-size: 12px; color: var(--ink-3); }
.todo-item .t { font-weight: 600; overflow-wrap: anywhere; }
.todo-item ul { margin: 4px 0 0; padding-left: 16px; font-size: 14px; color: var(--ink-2); display: flex; flex-direction: column; gap: 2px; }
.todo-item ul li.tb { color: var(--persimmon); font-weight: 600; }

/* trip overview */
.ov-intro { margin: 0; display: flex; flex-direction: column; gap: 6px; font-size: 14px; color: var(--ink-2); }
.ov-intro p { margin: 0; }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.stat { background: var(--surface-2); border-radius: 10px; padding: 8px 10px; display: flex; flex-direction: column; gap: 0; min-width: 0; }
.stat b { font-family: var(--font-display); font-size: 20px; line-height: 1.15; font-variant-numeric: tabular-nums; }
.stat span { font-size: 12px; color: var(--ink-3); font-weight: 500; }
.steps { margin: 0; padding: 0; list-style: none; counter-reset: st; display: flex; flex-direction: column; gap: 10px; }
.steps li { counter-increment: st; display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 10px; align-items: start; font-size: 14px; color: var(--ink-2); }
.steps li::before { content: counter(st); width: 26px; height: 26px; border-radius: 13px; background: var(--accent-soft); color: var(--accent); font-weight: 700; font-size: 13px; display: flex; align-items: center; justify-content: center; }
.steps li b { color: var(--ink); }
.steps .ic { display: inline-block; vertical-align: -3px; color: var(--accent); }
.hs-head { display: flex; align-items: center; gap: 12px; }
.hs-head svg { flex: none; width: 44px; height: 44px; border-radius: 10px; }
.hs-head p { margin: 2px 0 0; font-size: 13px; color: var(--ink-3); }
.who-row { display: flex; flex-wrap: wrap; gap: 6px; }
.who-row .meta { font-weight: 600; }
.leg { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; padding: 12px 0; border-top: 1px solid var(--line); }
.leg:first-child { border-top: 0; padding-top: 2px; }
.leg .lh { display: flex; align-items: center; gap: 8px; font-weight: 600; flex-wrap: wrap; overflow-wrap: anywhere; }
.leg .lh svg { color: var(--ink-3); }
.leg .ld { font-size: 13px; color: var(--ink-2); text-align: right; white-space: nowrap; }
.leg .lt { grid-column: 1 / -1; display: flex; align-items: baseline; gap: 8px; font-family: var(--font-display); font-weight: 700; font-size: 20px; font-variant-numeric: tabular-nums; }
.leg .lt .dur { font-family: var(--font-body); font-size: 13px; font-weight: 500; color: var(--ink-3); }
.leg .lt svg { align-self: center; color: var(--ink-3); }
.leg .lc { font-size: 13px; font-weight: 600; color: var(--ink-2); }

/* expenses */
.hero-num { display: flex; flex-direction: column; gap: 2px; }
.hero-num .lbl { font-size: 13px; color: var(--ink-3); font-weight: 500; }
.hero-num .val { font-family: var(--font-display); font-size: 34px; font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; }
.hero-num .val small { font-size: 16px; font-weight: 600; color: var(--ink-3); margin-left: 4px; }
.seg { display: inline-flex; padding: 3px; border-radius: 999px; background: var(--surface-2); align-self: flex-start; }
.seg button { border: 0; background: transparent; min-height: 36px; padding: 0 14px; border-radius: 999px; font-size: 14px; font-weight: 600; color: var(--ink-2); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.pay { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; padding: 10px 0; border-top: 1px solid var(--line); align-items: center; }
.pay:first-child { border-top: 0; }
.pay .who { font-weight: 600; overflow-wrap: anywhere; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.pay .who .arrow { color: var(--ink-3); }
.pay .amt { font-family: var(--font-display); font-weight: 700; font-size: 17px; font-variant-numeric: tabular-nums; }
.bal { display: grid; grid-template-columns: 92px minmax(0, 1fr) 88px; gap: 10px; align-items: center; padding: 6px 0; font-size: 14px; }
.bal .bn { font-weight: 600; overflow-wrap: anywhere; line-height: 1.2; }
.bal .bt { position: relative; height: 10px; }
.bal .bt::before { content: ""; position: absolute; left: 50%; top: -3px; bottom: -3px; width: 1px; background: var(--line); }
.bal .bf { position: absolute; top: 0; bottom: 0; border-radius: 3px; }
.bal .bf.pos { left: 50%; background: var(--pos); }
.bal .bf.neg { right: 50%; background: var(--neg); }
.bal .bv { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
.bal .bv.pos { color: var(--pos); }
.bal .bv.neg { color: var(--neg); }
.bal.sh { padding: 7px 0; }
.bal.sh .bt::before { display: none; }
.bal .bf.share { left: 0; background: var(--bar); }
.bal .bn small, .bal .bv small { display: block; font-size: 12px; font-weight: 500; color: var(--ink-3); }
.cat { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; padding: 6px 0; font-size: 14px; }
.cat .cb { grid-column: 1 / -1; height: 8px; background: var(--surface-2); border-radius: 4px; overflow: hidden; }
.cat .cb i { display: block; height: 100%; background: var(--bar); border-radius: 4px; }
.cat .cv { font-variant-numeric: tabular-nums; color: var(--ink-2); }
.curbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.curbar .hint { margin: 0; font-size: 13px; color: var(--ink-3); }
.foot { font-size: 12px; color: var(--ink-3); text-align: center; padding: 8px 0 0; display: flex; flex-direction: column; gap: 4px; }

/* tab bar */
nav.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 25;
  background: var(--surface); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px);
}
nav.tabbar .in { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(3, 1fr); height: var(--tabbar-h); }
nav.tabbar a {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  text-decoration: none; color: var(--ink-3); font-size: 12px; font-weight: 600;
}
nav.tabbar a[aria-current="page"] { color: var(--accent); }
nav.tabbar a.hero { justify-content: flex-end; padding-bottom: 8px; color: var(--accent); }
nav.tabbar a.hero .bub {
  width: 56px; height: 56px; margin-top: -26px; border-radius: 28px;
  display: flex; align-items: center; justify-content: center;
  background: var(--accent); color: var(--on-accent);
  border: 4px solid var(--surface); box-shadow: 0 4px 12px rgba(24,33,58,.28);
  transition: transform .15s;
}
nav.tabbar a.hero:not([aria-current="page"]) .bub { background: var(--accent-soft); color: var(--accent); box-shadow: 0 2px 6px rgba(24,33,58,.18); }
nav.tabbar a.hero:not([aria-current="page"]) { color: var(--ink-3); }
nav.tabbar a.hero:active .bub { transform: scale(.94); }
.top .wrap { position: relative; }
.top .eyebrow, .top h1, .top .sub { padding-right: 56px; }
.hbtn {

  var view = document.getElementById('view');
  document.getElementById('days').hidden = true;
  document.querySelector('nav.tabbar').hidden = true;
  document.getElementById('eyebrow').textContent = 'Trips';
  document.getElementById('title').textContent = 'OOO';
  if (!boot || !boot.any) {
    document.getElementById('sub').textContent = '';
    view.innerHTML = '<div class="section gate"><h3>No trip set up yet</h3><p class="hint">Ask JY to add the trip to the web app.</p></div>';
    return;
  }
  // Trips this device has unlocked before: localStorage 'trip-<key>-pin' holds 'k:<key>'. Only these are ever listed.
  function savedCreds() {
    var out = {};
    try {
      for (var i = 0; i < localStorage.length; i++) {
        var m = /^trip-(.+)-pin$/.exec(localStorage.key(i) || '');
        var v = m ? localStorage.getItem(localStorage.key(i)) : '';
        if (m && v && v.indexOf('k:') === 0) out[m[1]] = v;
      }
    } catch (e) {}
    // keys carried in the link (ks=trip:key,...): a Home Screen icon forgets localStorage when closed
    Object.keys(boot.ks || {}).forEach(function (k) { if (!out[k]) out[k] = 'k:' + boot.ks[k]; });
    return out;
  }
  var want = boot.trip || '';
  // Add to Home Screen steps (Trip tab and the ?setup=1 screen)
  var SHARE_IC = '<svg class="ic" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-label="Share"><path d="M12 3v12"/><path d="M8 7l4-4 4 4"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg>';
  var HS_IPHONE = '<b>iPhone:</b> in Safari, tap Share ' + SHARE_IC + ', then <b>Add to Home Screen</b> and <b>Add</b>.';
  var HS_ANDROID = '<b>Android:</b> in Chrome, tap the menu <b>⋮</b>, then <b>Add to Home screen</b>.';
  window.__oooHsHow = HS_IPHONE + '<br>' + HS_ANDROID;
  // App icon drawn inline (no image request, so it can't show as a broken image)
  var LOGO = '<svg viewBox="0 0 512 512" aria-hidden="true"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3B5BC4"/><stop offset="1" stop-color="#1B2C66"/></linearGradient></defs>' +
    '<rect width="512" height="512" fill="url(#lg)"/><g fill="none" stroke="#fff" stroke-width="22" stroke-linejoin="round" stroke-linecap="round"><path d="M206 168v-26a20 20 0 0 1 20-20h60a20 20 0 0 1 20 20v26"/><rect x="126" y="168" width="260" height="200" rx="34"/><path d="M196 168v200M316 168v200"/></g>' +
    '<circle cx="176" cy="396" r="14" fill="#fff"/><circle cx="336" cy="396" r="14" fill="#fff"/><path transform="translate(330 96) rotate(35)" d="M0 -44 L10 -10 L46 8 L46 20 L10 10 L6 34 L18 44 L18 52 L0 46 L-18 52 L-18 44 L-6 34 L-10 10 L-46 20 L-46 8 L-10 -10 Z" fill="#FFD27A"/></svg>';
  window.__oooLogo = LOGO.replace(/id="lg"/, 'id="lg2"').replace('url(#lg)', 'url(#lg2)');
  view.innerHTML = '<div class="splash" id="splash" hidden>' + LOGO + '<h3>OOO</h3><p>Opening your trip…</p></div>' +
    '<form class="section gate" id="gate" autocomplete="off">' +
    '<h3>Open your trip</h3><p class="hint">Enter the PIN JY shared with you. This device remembers it after the first time.</p>' +
    '<label for="pin" class="sr">Trip PIN</label>' +
    '<input id="pin" name="pin" type="password" inputmode="numeric" autocomplete="off" placeholder="PIN" required>' +
    '<button type="submit" class="btn primary" id="unlock">Open trip</button>' +
    '<p class="hint" id="gate-msg" role="status" aria-live="polite"></p></form>';
  var form = document.getElementById('gate'), input = document.getElementById('pin'), msg = document.getElementById('gate-msg'), btn = document.getElementById('unlock');
  var splash = document.getElementById('splash'), sub = document.getElementById('sub');
  if (boot.setup) {
    var keepQ = new URLSearchParams(location.search); keepQ.delete('setup');
    try { history.replaceState(null, '', location.pathname + (keepQ.toString() ? '?' + keepQ.toString() : '')); } catch (e) {}
    view.insertAdjacentHTML('afterbegin', '<div class="section gate" id="hs-steps"><div class="hs-head">' + window.__oooLogo + '<div><h3>Add OOO to your Home Screen</h3></div></div>' +
      '<ol class="steps"><li><span>' + HS_IPHONE + '</span></li><li><span>' + HS_ANDROID + '</span></li></ol>' +
      '<p class="hint">The icon opens every trip you have unlocked. Keep it to yourself: it works like your PINs.</p>' +
      '<p class="hint"><a href="' + esc(location.pathname + (keepQ.toString() ? '?' + keepQ.toString() : '')) + '">Done, open OOO</a></p></div>');
    document.getElementById('days').hidden = true;
    document.getElementById('gate').hidden = true;
    sub.textContent = '';
    return;
  }
  function showSplash(on) {
    splash.hidden = !on; form.hidden = on;
    sub.textContent = on ? '' : (boot.add ? 'Enter the PIN of the trip you want to add.' : 'Enter the trip PIN to open the plan.');
  }
  // Pages copy: the last trip opened on this device, shown at once next time while the server checks for changes
  function saveLast(d) {
    if (!boot.pages) return;
    try { var c = JSON.parse(JSON.stringify(d)); delete c.boot; localStorage.setItem('ooo-last', JSON.stringify(c)); } catch (e) {}
  }
  function forgetLast() { store('ooo-last', null); }
  window.__tripSaveLast = function (nd) { if (boot.pages) { try { var c = JSON.parse(localStorage.getItem('ooo-last') || 'null'); if (c && c.meta && nd.meta && c.meta.key === nd.meta.key) { nd.deviceKey = c.deviceKey; nd.mine = c.mine; nd.keys = c.keys; saveLast(nd); delete nd.mine; delete nd.keys; } } catch (e) {} } };
  function lastCopy() {
    if (!boot.pages || boot.add) return null;
    var c = null; try { c = JSON.parse(localStorage.getItem('ooo-last') || 'null'); } catch (e) {}
    if (!c || !c.meta || !c.deviceKey) return null;
    var k = c.meta.key, creds = savedCreds();
    // only a trip this device (or this link) still holds a key for, and the one the link asks for if it names one
    if (want && want !== k) return null;
    if (creds[k] !== 'k:' + c.deviceKey && !(want === k && boot.k === c.deviceKey)) return null;
    return c;
  }
  var MSG = { wrong: "That PIN didn't work. Check it and try again.", locked: 'Too many wrong tries. Wait 10 minutes and try again.', setup: "This trip isn't set up yet. Ask JY." };
  // Server answered with the trip: remember its keys, put them in the link, show it.
  // A stale answer (last good copy from the cache) is shown at once, then refreshed in the background.
  function opened(d, pin, saved) {
    var key = d.meta.key;
    var cred = d.deviceKey ? 'k:' + d.deviceKey : pin;
    // forget saved keys that no longer work (that trip's PIN was changed)
    var ok = {}; (d.mine || []).forEach(function (t) { ok[t.key] = 1; });
    Object.keys(saved).forEach(function (k) { if (!ok[k]) store('trip-' + k + '-pin', null); });
    // a PIN shared by several trips unlocks all of them: remember each one
    Object.keys(d.keys || {}).forEach(function (k) { store('trip-' + k + '-pin', 'k:' + d.keys[k]); });
    store('trip-' + key + '-pin', cred); window.__tripCred = cred; window.__tripKey = key;
    // Put the trip and key in the page link, so a Home Screen icon added from here opens this trip without the PIN
    // With several trips, the link carries all their keys (ks) and no trip, so the icon opens the current trip and lists the rest
    var ks = Object.keys(d.keys || {}).map(function (k) { return k + ':' + d.keys[k]; }).join(',');
    if (d.deviceKey && window.google && google.script && google.script.history) {
      try {
        google.script.history.replace(null, (d.mine || []).length > 1 ? { ks: ks } : { trip: key, k: d.deviceKey }, '');
      } catch (e) {}
    } else if (d.deviceKey && boot.pages) {
      var lq = (d.mine || []).length > 1 ? '?ks=' + encodeURIComponent(ks).replace(/%3A/g, ':').replace(/%2C/g, ',') : '?trip=' + encodeURIComponent(key) + '&k=' + d.deviceKey;
      try { history.replaceState(null, '', location.pathname + lq + location.hash); } catch (e) {}
    }
    var stale = d.stale;
    if (!stale) saveLast(d);
    d.boot = { url: boot.url, trips: d.mine || [], ks: ks, launcher: boot.launcher || '', pages: !!boot.pages };
    delete d.mine; delete d.keys; delete d.stale;
    startApp(d);
    if (stale && canCallServer()) {
      sub.textContent = 'Checking for changes…';
      var all = savedCreds();
      callServer('openTrip', [key, cred, all, false],
        function (json) { if (json) opened(JSON.parse(json), cred, all); },
        function (err) {
          // the trip's PIN was changed since this copy was kept: drop it and ask again
          if (boot.pages && /wrong|needpin|setup/.test(String(err && err.message || err))) { forgetLast(); store('trip-' + key + '-pin', null); location.replace(location.pathname); return; }
          sub.textContent = "Couldn't check for changes. Pull down to refresh.";
        });
    }
  }
  function attempt(pin, auto) {
    if (!canCallServer()) { showSplash(false); msg.textContent = 'Open this page from its web app link.'; return; }
    var saved = savedCreds();
    btn.disabled = true; msg.textContent = auto ? 'Opening…' : 'Checking…';
    callServer('openTrip', [want, pin, saved, true],
      function (json) { opened(JSON.parse(json), pin, saved); },
      function (err) {
        showSplash(false);
        btn.disabled = false;
        var m = String(err && err.message || err);
        var key = m.indexOf('needpin') > -1 ? 'needpin' : m.indexOf('locked') > -1 ? 'locked' : m.indexOf('setup') > -1 ? 'setup' : m.indexOf('wrong') > -1 ? 'wrong' : null;
        if (key === 'needpin') { msg.textContent = ''; input.focus(); return; }
        if (key === 'wrong' && want && pin.indexOf('k:') === 0) store('trip-' + want + '-pin', null);
        msg.textContent = key ? (auto && key === 'wrong' ? 'The saved PIN no longer works. Enter the new one, then add the page to your Home Screen again.' : MSG[key]) : 'Could not load the trip. Check your connection and try again.';
        input.focus();
      });
  }
  form.addEventListener('submit', function (e) { e.preventDefault(); var v = input.value.trim(); if (v) attempt(v, false); });
  // Home Screen link carries its own key; otherwise try this device's saved keys (no PIN typed)
  var first = boot.k && want ? 'k:' + boot.k : '';
  if (boot.add) { showSplash(false); input.focus(); }
  // the server already put the cached trip in the page (Home Screen link): show it now, refresh in the background
  else if (boot.pre && boot.pre.meta) { var pre = boot.pre; pre.stale = true; opened(pre, first, savedCreds()); }
  else if (lastCopy()) { var lc = lastCopy(); lc.stale = true; opened(lc, 'k:' + lc.deviceKey, savedCreds()); }
  else if (first || Object.keys(savedCreds()).length) { showSplash(true); attempt(first, true); }
  else showSplash(false), input.focus();
})();
</script>
